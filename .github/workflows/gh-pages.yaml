name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - closed
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '25.x'
          cache: 'npm'

      - run: npm ci

      - run: npm run clean

      - name: Cache Eleventy images
        uses: actions/cache@v4
        with:
          path: |
            .cache
            dist/assets/images
            dist/img
          key: ${{ runner.os }}-eleventy-images-v1-${{ hashFiles('package-lock.json', 'eleventy.config.js', 'src/_config/shortcodes/image.js') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ runner.os }}-eleventy-images-v1-${{ hashFiles('package-lock.json', 'eleventy.config.js', 'src/_config/shortcodes/image.js') }}-

      - name: Build
        env:
          URL: https://aquapackrobotics.org
        # Cleaning must happen before restoring the processed images.
        run: npm run build:11ty

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        if: github.ref == 'refs/heads/main'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          cname: aquapackrobotics.org
